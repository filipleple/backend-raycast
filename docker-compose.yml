# The game runs behind 629fm's Caddy at 629fm.com/raycast/ and uses 629fm
# accounts (629Manager), so it joins the core 629fm stack's network (like
# slots does). Bring the 629fm stack up first: it creates that network.
networks:
  629fm:
    name: ${RAYCAST_629FM_NETWORK:-629fm_default}
    external: true

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d myapp"]
      interval: 5s
      retries: 5

  go-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    networks:
      default:
      629fm:
        aliases: [raycast] # the upstream name in 629fm's Caddyfile
    environment:
      DATABASE_URL: "user=${POSTGRES_USER} dbname=${POSTGRES_DB} password=${POSTGRES_PASSWORD} host=db port=5432 sslmode=disable"
      CONTENT_DIR: /app/content
      # 629fm accounts: Manager's private API + this game's scoped key
      # (MANAGER_RAYCAST_SERVICE_KEY must match the one 629fm's manager has).
      MANAGER_BASE_URL: ${MANAGER_BASE_URL:-http://manager:8081}
      MANAGER_RAYCAST_SERVICE_KEY: ${MANAGER_RAYCAST_SERVICE_KEY:?MANAGER_RAYCAST_SERVICE_KEY is required}
    volumes:
      # Game content is a git-versioned directory mounted at runtime, not baked
      # into the image — the admin panel syncs + hot-reloads it in place, so
      # content changes need no rebuild/redeploy. `./content` is a git repo.
      - ./content:/app/content
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
