<!DOCTYPE html>
<html>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#000">

<div id="stage" style="position:relative">
    <canvas id="screen" width="320" height="240" style="width:640px;height:480px;image-rendering:pixelated"></canvas>
    <div id="popup" style="display:none;position:absolute;left:50%;top:18%;transform:translateX(-50%);
        max-width:90%;padding:10px 22px;background:rgba(10,5,30,.85);border:2px solid #d4af37;border-radius:4px;
        color:#ffe9a0;font:18px monospace;text-align:center;white-space:pre-wrap;pointer-events:none;
        text-shadow:0 0 6px #d4af37"></div>
</div>

<!-- full-screen picture viewer (Space on a painting); Space/Esc/click closes -->
<div id="viewer" style="display:none;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.88);
    justify-content:center;align-items:center;cursor:pointer">
    <img id="viewerImg" alt="" style="max-width:92vw;max-height:92vh;object-fit:contain;
        filter:drop-shadow(0 0 24px #000)">
</div>

<script src="/wasm_exec.js"></script>
<script>
// Browser-side engine: the page owns networking, timing and input; the Go
// engine compiled to WebAssembly (cmd/client → engine.wasm, global `raycast`)
// owns the map, movement prediction and rendering. The server validates moves
// and runs doors, scripts and music. Legacy JPEG streaming: /game-jpeg.html.
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

fetch("/me").then(res => {
    if (!res.ok) {
        ctx.fillStyle = "white";
        ctx.font = "20px monospace";
        ctx.textAlign = "center";
        ctx.fillText("not logged in", canvas.width / 2, canvas.height / 2 - 16);
        ctx.fillStyle = "#aaaaff";
        ctx.fillText("< back to menu", canvas.width / 2, canvas.height / 2 + 16);
        canvas.style.cursor = "pointer";
        canvas.onclick = () => window.location.href = "/";
        return;
    }
    loadEngine().then(startGame).catch(e => {
        console.error(e);
        ctx.fillStyle = "white";
        ctx.font = "16px monospace";
        ctx.textAlign = "center";
        ctx.fillText("engine failed to load", canvas.width / 2, canvas.height / 2);
    });
});

function loadEngine() {
    return new Promise((resolve, reject) => {
        const go = new Go();
        window.onRaycastReady = resolve;
        WebAssembly.instantiateStreaming(fetch("/engine.wasm"), go.importObject)
            .then(r => go.run(r.instance))
            .catch(reject);
    });
}

// ---------------------------------------------------------------------------
// AudioEngine — all playback happens here in the browser; the server only
// sends tiny JSON events ("play M0002, fade 1500ms"). Browsers refuse to make
// noise before a user gesture, so everything queues until the first keydown.
// ---------------------------------------------------------------------------
const audio = {
    ctx: null,
    unlocked: false,
    buffers: {},          // url -> Promise<AudioBuffer>
    music: null,          // {id, src, gain}
    musicSeq: 0,          // guards against out-of-order async loads
    pendingMusic: null,   // last music event seen while still locked

    unlock() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.ctx.resume();
        if (!this.unlocked) {
            this.unlocked = true;
            if (this.pendingMusic) { const ev = this.pendingMusic; this.pendingMusic = null; this.setMusic(ev); }
        }
    },

    buffer(url) {
        if (!this.buffers[url]) {
            this.buffers[url] = fetch(url)
                .then(r => { if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`); return r.arrayBuffer(); })
                .then(b => this.ctx.decodeAudioData(b));
            this.buffers[url].catch(e => { console.error("audio load failed:", e); delete this.buffers[url]; });
        }
        return this.buffers[url];
    },

    async setMusic(ev) {
        if (!this.unlocked) { this.pendingMusic = ev; return; }
        if (this.music && this.music.id === ev.id) return;
        const seq = ++this.musicSeq;
        const fade = (ev.fade ?? 1500) / 1000;
        const now = this.ctx.currentTime;

        if (this.music) { // fade the old track out and stop it
            const old = this.music;
            this.music = null;
            old.gain.gain.cancelScheduledValues(now);
            old.gain.gain.setValueAtTime(old.gain.gain.value, now);
            old.gain.gain.linearRampToValueAtTime(0, now + fade);
            setTimeout(() => { try { old.src.stop(); } catch (e) {} }, fade * 1000 + 100);
        }
        if (!ev.file) return; // silence zone

        const buf = await this.buffer(ev.file).catch(() => null);
        if (!buf || seq !== this.musicSeq) return; // superseded while loading

        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        src.loop = ev.loop ?? true;
        const gain = this.ctx.createGain();
        const t = this.ctx.currentTime;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(ev.volume ?? 1, t + fade);
        src.connect(gain).connect(this.ctx.destination);
        src.start();
        this.music = { id: ev.id, src, gain };
    },

    async playSound(ev) {
        if (!this.unlocked) return;
        const buf = await this.buffer(ev.file).catch(() => null);
        if (!buf) return;
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        const gain = this.ctx.createGain();
        gain.gain.value = ev.vol ?? 1;
        let node = gain;
        if (ev.pan && this.ctx.createStereoPanner) {
            const pan = this.ctx.createStereoPanner();
            pan.pan.value = Math.max(-1, Math.min(1, ev.pan));
            gain.connect(pan); node = pan;
        }
        src.connect(gain); node.connect(this.ctx.destination);
        src.start();
    },

    tone(ev) { // synthesized beep — scripts can make noise with zero assets
        if (!this.unlocked) return;
        const t = this.ctx.currentTime + (ev.delay ?? 0) / 1000, dur = (ev.ms ?? 200) / 1000;
        const osc = this.ctx.createOscillator();
        osc.type = ev.wave ?? "sine";
        osc.frequency.value = ev.freq ?? 440;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(ev.vol ?? 0.5, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + dur);
    },
};

// ---------------------------------------------------------------------------
// Server event dispatch. One handler per "type"; unknown types are ignored,
// so server scripts can invent new ones (see scripts/README.md). ctx.send() /
// ctx.js() on the server land here.
// ---------------------------------------------------------------------------
let popupTimer = null;
function showPopup(ev) {
    const el = document.getElementById("popup");
    if (ev.html) el.innerHTML = ev.text; else el.textContent = ev.text;
    el.style.display = "block";
    clearTimeout(popupTimer);
    popupTimer = setTimeout(() => { el.style.display = "none"; }, ev.ms ?? 3000);
}

// Picture viewer. While it's open the game gets no input, so you can't walk
// away under it; the key that closes it is swallowed until released, so the
// same Space doesn't reach the server and re-open the painting.
const viewer = {
    el: document.getElementById("viewer"),
    img: document.getElementById("viewerImg"),
    get open() { return this.el.style.display !== "none"; },
    show(ev) {
        this.img.src = ev.src;
        this.el.style.display = "flex";
    },
    close() {
        this.el.style.display = "none";
        this.img.removeAttribute("src");
    },
};
viewer.el.addEventListener("click", () => viewer.close());

const HANDLERS = {
    picture: ev => viewer.show(ev),
    music: ev => audio.setMusic(ev),
    sound: ev => audio.playSound(ev),
    tone:  ev => audio.tone(ev),
    popup: ev => showPopup(ev),
    // Yes, the server can run arbitrary JS here. Server scripts are trusted
    // (they already control everything you see); this is the escape hatch
    // that keeps the client extensible without touching this file.
    eval:  ev => new Function(ev.js)(),
};

function handleEvents(events) {
    for (const ev of events) {
        try { HANDLERS[ev.type]?.(ev); }
        catch (e) { console.error(`event ${ev.type} handler failed:`, e); }
    }
}

const SIM_MS = 100;            // movement ticks, same as the server's
const MOUSE_SENS = 0.003;      // radians per screen px (MouseSensitivity in game/types.go)
const SIM_KEYS = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "a", "d"];

function startGame() {
    const inputState = {};
    const swallowed = new Set(); // keys that closed the viewer, until released
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const wsUrl = `${proto}://${location.host}${location.pathname.replace(/\/[^/]*$/, "/ws")}?engine=client`;
    const ws = new WebSocket(wsUrl);

    // predicted pose: the sim steps prev -> cur every SIM_MS, frames
    // interpolate between them; mouse yaw applies to both immediately
    let prev = null, cur = null, simClock = 0;
    let epoch = 0, showMap = false;
    const others = new Map(); // id -> {px, py, x, y, t}
    const avatarsAsked = new Set();
    const frame = ctx.createImageData(canvas.width, canvas.height);

    function send(msg) { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg)); }
    function sendMove() {
        if (cur) send({ t: "move", x: cur.x, y: cur.y, a: cur.a, m: showMap, e: epoch });
    }

    // --- downloads: whatever the engine says it's missing --------------------
    const inflight = new Set();
    function pumpDownloads() {
        const version = raycast.version();
        for (const path of raycast.wanted()) {
            if (inflight.has(path)) continue;
            inflight.add(path);
            const url = "/content/" + path.split("/").map(encodeURIComponent).join("/") + "?v=" + version;
            fetch(url)
                .then(r => { if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`); return r.arrayBuffer(); })
                .then(buf => raycast.addFile(path, new Uint8Array(buf)))
                .catch(e => console.error("texture download failed:", e))
                .finally(() => inflight.delete(path));
        }
    }
    function fetchAvatar(id) {
        avatarsAsked.add(id);
        fetch(`/avatar/player/${id}`)
            .then(r => r.ok ? r.arrayBuffer() : null)
            .then(buf => { if (buf) raycast.setAvatar(id, new Uint8Array(buf)); })
            .catch(() => {});
    }

    // --- input ----------------------------------------------------------------
    window.addEventListener("keydown", (e) => {
        audio.unlock(); // browsers allow audio only after a user gesture
        if (viewer.open) {
            if (e.key === " " || e.key === "Escape" || e.key === "Enter") {
                e.preventDefault();
                viewer.close();
                swallowed.add(e.key);
            }
            return;
        }
        if (swallowed.has(e.key)) return; // key repeat of the closing press
        if (!e.repeat && e.key === "m") showMap = !showMap;
        if (!e.repeat && e.key === " ") {
            sendMove(); // the server resolves Space from our latest pose
            send({ t: "use" });
        }
        inputState[e.key] = true;
    });
    window.addEventListener("keyup", (e) => {
        swallowed.delete(e.key);
        inputState[e.key] = false;
    });

    // click to capture the pointer for FPS-style mouse look (Esc releases)
    canvas.addEventListener("click", () => {
        audio.unlock();
        if (document.pointerLockElement !== canvas) canvas.requestPointerLock();
    });
    document.addEventListener("mousemove", (e) => {
        if (document.pointerLockElement !== canvas || viewer.open || !cur) return;
        const da = e.movementX * MOUSE_SENS;
        cur.a += da;
        prev.a += da;
    });

    setInterval(sendMove, 50);

    // --- server state ---------------------------------------------------------
    ws.onmessage = (event) => {
        let msg;
        try { msg = JSON.parse(event.data); } catch (e) { console.error("bad state frame:", e); return; }
        const err = raycast.apply(event.data); // content, map, cells
        if (err) console.error("engine apply:", err);
        if (msg.pose) {
            cur = { x: msg.pose.x, y: msg.pose.y, a: msg.pose.a };
            prev = { ...cur };
            epoch = msg.pose.e;
            showMap = msg.pose.m;
            simClock = performance.now();
        }
        const now = performance.now(), seen = new Set();
        for (const p of msg.players) {
            seen.add(p.id);
            const o = others.get(p.id);
            if (o) { o.px = o.x; o.py = o.y; o.x = p.x; o.y = p.y; o.t = now; }
            else others.set(p.id, { px: p.x, py: p.y, x: p.x, y: p.y, t: now });
            if (p.av && !avatarsAsked.has(p.id)) fetchAvatar(p.id);
        }
        for (const id of others.keys()) if (!seen.has(id)) others.delete(id);
        if (msg.ev) handleEvents(msg.ev);
        pumpDownloads();
    };

    // --- frame loop -----------------------------------------------------------
    function loop(now) {
        requestAnimationFrame(loop);
        if (!cur) return;
        if (now - simClock > 5 * SIM_MS) simClock = now - SIM_MS; // tab slept: don't fast-forward
        const keys = viewer.open ? {} : inputState; // the viewer freezes the player
        while (now - simClock >= SIM_MS) {
            prev = cur;
            const [x, y, a] = raycast.step(cur.x, cur.y, cur.a, keys);
            cur = { x, y, a };
            simClock += SIM_MS;
        }
        const f = (now - simClock) / SIM_MS;
        const lerp = (a, b, t) => a + (b - a) * t;

        const flat = new Float64Array(others.size * 3);
        let i = 0;
        for (const [id, o] of others) {
            const t = Math.min(1, (now - o.t) / SIM_MS);
            flat[i++] = id; flat[i++] = lerp(o.px, o.x, t); flat[i++] = lerp(o.py, o.y, t);
        }
        if (raycast.render(lerp(prev.x, cur.x, f), lerp(prev.y, cur.y, f), lerp(prev.a, cur.a, f), showMap, flat, frame.data)) {
            ctx.putImageData(frame, 0, 0);
        }
        pumpDownloads();
    }
    requestAnimationFrame(loop);

    ws.onclose = () => {
        cur = null;
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "20px monospace";
        ctx.textAlign = "center";
        ctx.fillText("disconnected", canvas.width / 2, canvas.height / 2 - 16);
        ctx.fillStyle = "#aaaaff";
        ctx.fillText("< back to menu", canvas.width / 2, canvas.height / 2 + 16);
        canvas.style.cursor = "pointer";
        canvas.onclick = () => window.location.href = "/";
    };
}
</script>
</body>
</html>
