<!DOCTYPE html>
<html>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#000">

<canvas id="screen" width="320" height="240" style="width:640px;height:480px;image-rendering:pixelated"></canvas>

<script>
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

fetch("/me").then(res => {
    if (!res.ok) {
        ctx.fillStyle = "white";
        ctx.font = "20px monospace";
        ctx.textAlign = "center";
        ctx.fillText("not logged in", canvas.width / 2, canvas.height / 2 - 16);
        ctx.fillStyle = "#aaaaff";
        ctx.fillText("< back to menu", canvas.width / 2, canvas.height / 2 + 16);
        canvas.style.cursor = "pointer";
        canvas.onclick = () => window.location.href = "/";
        return;
    }
    startGame();
});

function startGame() {
    const inputState = {};
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const wsUrl = `${proto}://${location.host}${location.pathname.replace(/\/[^/]*$/, "/ws")}`;
    const ws = new WebSocket(wsUrl);
    ws.binaryType = "blob";

    window.addEventListener("keydown", (e) => {
        inputState[e.key] = true;
    });

    window.addEventListener("keyup", (e) => {
        inputState[e.key] = false;
    });

    setInterval(() => {
        if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(inputState));
        }
    }, 50);

    ws.onmessage = async (event) => {
        const bitmap = await createImageBitmap(event.data);
        ctx.drawImage(bitmap, 0, 0);
        bitmap.close();
    };

    ws.onclose = () => {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "20px monospace";
        ctx.textAlign = "center";
        ctx.fillText("disconnected", canvas.width / 2, canvas.height / 2 - 16);
        ctx.fillStyle = "#aaaaff";
        ctx.fillText("< back to menu", canvas.width / 2, canvas.height / 2 + 16);
        canvas.style.cursor = "pointer";
        canvas.onclick = () => window.location.href = "/";
    };
}
</script>
</body>
</html>
