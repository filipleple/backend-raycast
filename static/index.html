<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>raycast</title>
  <style>
    body {
      background: #000080;
      color: #ffffff;
      font-family: "Comic Sans MS", "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      margin: 0;
    }

    h1 { margin: 0 0 4px 0; font-size: 2em; letter-spacing: 2px; }
    h2 { margin: 0 0 12px 0; font-size: 1em; font-weight: normal; }

    hr { border: 1px dashed #aaaaff; width: 100%; margin: 16px 0; }

    .panel {
      border: 2px solid #aaaaff;
      padding: 20px 24px;
      width: 320px;
      background: #000050;
    }

    .panel h3 { margin: 0 0 12px 0; font-size: 1em; text-transform: uppercase; letter-spacing: 1px; }

    input[type="file"] {
      width: 100%;
      box-sizing: border-box;
      background: #000020;
      border: 1px solid #aaaaff;
      color: #ffffff;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 0.9em;
      margin-bottom: 8px;
    }

    button {
      background: #0000aa;
      border: 2px outset #aaaaff;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.9em;
      padding: 6px 16px;
      cursor: pointer;
      margin-top: 4px;
      margin-right: 6px;
    }
    button:active { border-style: inset; }
    button.danger  { background: #660000; border-color: #ff8888; }
    button.success { background: #005500; border-color: #88ff88; }

    .msg { font-size: 0.85em; margin-top: 8px; min-height: 1.2em; }
    .msg.err { color: #ff8888; }
    .msg.ok  { color: #88ff88; }

    #avatar-img {
      display: block;
      width: 80px;
      height: 80px;
      object-fit: cover;
      border: 2px solid #aaaaff;
      margin-bottom: 12px;
      image-rendering: pixelated;
    }

    #no-avatar { font-size: 0.8em; color: #aaaaaa; margin-bottom: 12px; }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

    #guest-panel, #user-panel { display: none; }
  </style>
</head>
<body>

  <h1>&#x25A0; RAYCAST</h1>
  <h2>multiplayer raycasting game</h2>
  <hr>

  <!-- not logged in on 629fm -->
  <div id="guest-panel">
    <div class="panel">
      <h3>log in first</h3>
      <div id="guest-msg" class="msg err"></div>
      <p>the game uses your 629fm account. log in on 629fm (in chat: <code>/login</code>), then come back.</p>
      <div class="actions">
        <a href="/"><button>&#x25C4; 629fm</button></a>
        <button onclick="window.location.reload()">retry</button>
      </div>
    </div>
  </div>

  <!-- logged in -->
  <div id="user-panel">
    <div class="panel">
      <h3>welcome, <span id="uname"></span></h3>
      <hr>

      <img id="avatar-img" alt="" onerror="this.style.display='none'; document.getElementById('no-avatar').style.display='block'">
      <div id="no-avatar" style="display:none">no avatar set</div>

      <h3>upload avatar</h3>
      <input id="avatar-file" type="file" accept="image/png,image/gif">
      <button onclick="uploadAvatar()">upload</button>
      <div id="avatar-msg" class="msg"></div>

      <hr>

      <div class="actions">
        <a href="game.html"><button class="success">&#x25BA; join game</button></a>
        <a id="admin-link" href="admin" style="display:none"><button>admin</button></a>
      </div>
    </div>
  </div>

<script src="session.js"></script>
<script>
  async function init() {
    const { user, error } = await startSession();
    if (!user) {
      document.getElementById("guest-msg").textContent = error;
      document.getElementById("guest-panel").style.display = "block";
      return;
    }
    document.getElementById("uname").textContent = user.username;
    document.getElementById("avatar-img").src = "avatar";
    if (user.is_admin) document.getElementById("admin-link").style.display = "inline";
    document.getElementById("user-panel").style.display = "block";
  }

  async function uploadAvatar() {
    const msg = document.getElementById("avatar-msg");
    const file = document.getElementById("avatar-file").files[0];
    if (!file) {
      msg.textContent = "pick a file first";
      msg.className = "msg err";
      return;
    }
    const form = new FormData();
    form.append("avatar", file);
    const res = await fetch("avatar/upload", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) {
      msg.textContent = data.error;
      msg.className = "msg err";
      return;
    }
    msg.textContent = data.message;
    msg.className = "msg ok";
    const img = document.getElementById("avatar-img");
    img.style.display = "block";
    document.getElementById("no-avatar").style.display = "none";
    img.src = "avatar?t=" + Date.now();
  }

  init();
</script>
</body>
</html>
